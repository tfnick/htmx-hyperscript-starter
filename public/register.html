<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <title>NodeSeek-Style Forum</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/styles.css" rel="stylesheet" />
  <script src="https://unpkg.com/htmx.org"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
  <script src="/extensions.js" defer></script>
  <script>
    (() => {
      const local = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
      if (!local) return;

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${window.location.host}/reload_ws`);
      socket.addEventListener("message", () => window.location.reload());
    })();
  </script>
</head>

<body>
  {{template "layout/header" .}}

  <main class="login-shell">
    <section class="login-panel" aria-labelledby="register-title">
      <p class="eyebrow">Account</p>
      <h1 id="register-title">注册</h1>

      <form id="register-form" class="login-form">
        <label>
          <span>Name</span>
          <input name="name" autocomplete="name" required />
        </label>
        <label>
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <button type="submit">注册</button>
      </form>

      <p class="login-switch">已经有账号？<a href="/login">去登录</a></p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>

</html>
