<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <title>NodeSeek-Style Forum</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/styles.css" rel="stylesheet" />
  <script src="https://unpkg.com/htmx.org"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
  <script src="/extensions.js" defer></script>
  <script>
    (() => {
      const local = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
      if (!local) return;

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${window.location.host}/reload_ws`);
      socket.addEventListener("message", () => window.location.reload());
    })();
  </script>
</head>

<body>
  <header class="site-header">
    <nav class="topbar" aria-label="主导航">
      <a class="brand" href="/" aria-label="NodeSeek 首页">
        <span class="brand-mark">◉</span>
        <span class="brand-name">NodeSeek</span>
        <span class="brand-beta">beta</span>
      </a>

      <div id="top-board-links" class="top-board-links" aria-label="热门板块"></div>

      <form id="search-form" class="top-search">
        <input id="search-input" name="q" type="search" placeholder="Search" autocomplete="off" />
        <button type="submit" aria-label="搜索">⌕</button>
      </form>

      <a class="top-login-link" href="/login">登录</a>
    </nav>
  </header>

  <main class="page-shell">
    <aside class="category-rail" aria-label="论坛板块">
      <div id="category-list" class="category-list" aria-live="polite"></div>
    </aside>

    <section class="feed-panel" aria-labelledby="board-title">
      <header class="feed-toolbar">
        <div class="feed-tabs" aria-label="帖子筛选">
          <button class="tab-button is-active" type="button" data-sort-tab="latest_reply">新评论</button>
          <button class="tab-button" type="button" data-sort-tab="latest_post">新帖子</button>
        </div>

        <div class="feed-pager" aria-label="帖子列表分页">
          <button type="button" class="pager-button" data-thread-page-action="previous" aria-label="上一页">‹</button>
          <span class="page-summary" data-thread-page-summary>1</span>
          <button type="button" class="pager-button" data-thread-page-action="next" aria-label="下一页">›</button>
        </div>
      </header>

      <section class="board-heading">
        <div>
          <p class="eyebrow">Board</p>
          <h1 id="board-title">日常</h1>
        </div>
        <select id="sort-select" class="sort-select" name="sort" aria-label="排序">
          <option value="latest_reply">最新评论</option>
          <option value="latest_post">最新发布</option>
        </select>
      </section>

      <div id="thread-list" class="thread-list" aria-live="polite"></div>

      <nav class="feed-pager feed-pager-bottom" aria-label="帖子列表底部分页">
        <button type="button" class="pager-button" data-thread-page-action="previous" aria-label="上一页">‹</button>
        <span class="page-summary" data-thread-page-summary>1</span>
        <button type="button" class="pager-button" data-thread-page-action="next" aria-label="下一页">›</button>
      </nav>

    </section>

    <aside class="right-sidebar" aria-label="社区功能">
      <section class="side-card auth-card">
        <div id="logged-out-panel">
          <h2>你好啊，陌生人！</h2>
          <p>我的朋友，看起来你是新来的，如果想参与到讨论中，点击下面的按钮！</p>
          <div class="auth-actions">
            <a class="primary-action" href="/login">登录</a>
            <a class="primary-action" href="/register">注册</a>
          </div>
        </div>

        <div id="logged-in-panel" hidden>
          <h2>欢迎回来</h2>
          <p id="current-user-name" class="current-user"></p>
          <div class="auth-actions">
            <a id="create-post-link" class="primary-action" href="/new-post">发帖</a>
            <button id="logout-button" type="button" class="secondary-action">退出登录</button>
          </div>
        </div>
      </section>

      <section class="side-card quick-card">
        <h2>♟ 快捷功能区</h2>
        <a href="#thread-list">推荐阅读</a>
        <a href="/new-post">发帖</a>
        <a href="#thread-list">邀请好友</a>
        <a href="#thread-list">合作商家</a>
        <a href="#thread-list">友站链接</a>
      </section>

      <section class="sponsor-stack" aria-label="赞助展示">
        <div class="sponsor-card cloud"><strong>DreamCloud</strong><span>亚太高防云</span></div>
        <div class="sponsor-card vps"><strong>双ISP原生住宅VPS</strong><span>服务全解锁</span></div>
        <div class="sponsor-card cdn"><strong>日本香港高防无敌节点</strong><span>无视 DDOS 打死退款</span></div>
        <div class="sponsor-card dark"><strong>EVOXT</strong><span>同样价格，我们快 2.5 倍！</span></div>
        <div class="sponsor-card line"><strong>Seek.li</strong><span>社区服务导航</span></div>
        <div class="sponsor-card quality"><strong>NodeQuality</strong><span>网络质量工具</span></div>
        <div class="sponsor-card script"><strong>NodeScriptKit</strong><span>脚本与工具箱</span></div>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>

</html>
